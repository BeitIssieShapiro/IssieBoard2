# IssieCalc: 2 + 3 = shows 5.
# iOS by default; Android: maestro test -e APP_ID=org.issieshapiro.issiecalc ...
appId: ${APP_ID || "com.issieshapiro.IssieCalc"}
---
- launchApp:
    clearState: true
- waitForAnimationToEnd:
    timeout: 10000
- tapOn: "2"
- tapOn: "+"
- tapOn: "3"
- tapOn: "="
- assertVisible: "5"
- takeScreenshot: calc-result
