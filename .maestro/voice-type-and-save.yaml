# IssieVoice: type on the embedded keyboard, speak, save the sentence and find it in Browse.
# iOS by default; Android: maestro test -e APP_ID=org.issieshapiro.issievoice ...
appId: ${APP_ID || "org.issieshapiro.IssieVoice"}
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "voice-keyboard"
    timeout: 15000
- tapOn: "h"
- tapOn: "i"
- tapOn:
    id: "voice-speak-btn"
- tapOn:
    id: "voice-save-btn"
- tapOn:
    id: "voice-browse-btn"
- assertVisible:
    id: "sentence-text-0"
- tapOn:
    id: "sentence-insert-0"
- tapOn:
    id: "voice-clear-btn"
- takeScreenshot: voice-browse
